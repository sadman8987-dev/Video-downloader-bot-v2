name: Docker Build and Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag video-downloader-bot-v2:test .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: video-downloader-bot-v2:test
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
